name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS 빌드 + 단위 테스트
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Xcode 선택
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: XcodeGen 설치
        run: brew install xcodegen
      # 러너가 막 켜졌을 때 시뮬레이터 서비스가 늦게 떠서 기기를 못 찾는 경우가 있다.
      # 먼저 목록을 한 번 불러 서비스를 깨우고, iPhone 17이 없으면 여기서 이유를 보여 주고 멈춘다.
      - name: 시뮬레이터 확인
        run: |
          for i in 1 2 3; do
            xcrun simctl list devices available | grep -qF "iPhone 17 (" && exit 0
            echo "iPhone 17 시뮬레이터를 찾지 못함 (시도 $i/3), 10초 뒤 다시 확인"; sleep 10
          done
          xcrun simctl list devices available; exit 1
      - name: 테스트
        run: |
          xcodegen generate
          xcodebuild test \
            -project CoffeeNote.xcodeproj \
            -scheme CoffeeNote \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -resultBundlePath TestResults.xcresult
      - name: 테스트 결과 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: TestResults.xcresult

  firebase:
    name: Functions 빌드 + 규칙 테스트 (Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: 의존성 설치
        run: npm --prefix functions ci
      - name: Emulator 캐시
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('functions/package-lock.json') }}
      - name: 빌드 · 타입 검사 · Emulator 테스트
        run: scripts/test-firebase.sh
