# XcodeGen 프로젝트 정의
# .xcodeproj는 이 파일로 생성하는 산출물이라 Git에 넣지 않는다.
#   생성: xcodegen generate   (또는 scripts/bootstrap.sh)
# 학습 노트: docs/learning/02-xcodegen.md

name: CoffeeNote

options:
  bundleIdPrefix: io.github.boifromangye
  developmentLanguage: ko          # D22: v1은 한국어만
  deploymentTarget:
    iOS: "17.0"                    # spec 4장: 최소 iOS 17.0
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 서명 팀은 각자 Xcode에서 지정한다(시뮬레이터 빌드에는 필요 없음).
    DEVELOPMENT_TEAM: ""

targets:
  CoffeeNote:
    type: application
    platform: iOS
    sources:
      - path: CoffeeNote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.boifromangye.CoffeeNote
        TARGETED_DEVICE_FAMILY: "1"                  # iPhone 전용
        GENERATE_INFOPLIST_FILE: YES
        # D11: 앱 이름은 이 한 곳(+ AppInfo.displayName)에서만 관리
        INFOPLIST_KEY_CFBundleDisplayName: 커피콩책
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  CoffeeNoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CoffeeNoteTests
    dependencies:
      - target: CoffeeNote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.boifromangye.CoffeeNoteTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  CoffeeNote:
    build:
      targets:
        CoffeeNote: all
        CoffeeNoteTests: [test]
    test:
      targets:
        - CoffeeNoteTests
      gatherCoverageData: true
